name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze lib test
      - run: flutter test --coverage
      - name: Coverage summary
        run: |
          awk -F: '/^LF:/{t+=$2} /^LH:/{h+=$2} END{if(t>0) printf "### Cobertura Flutter\n\nLinhas cobertas: %d/%d (%.2f%%)\n", h, t, h*100/t}' coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-lcov
          path: app/coverage/lcov.info
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/**/failures/
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: Coverage summary
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total;const l=t.lines;console.log('### Cobertura web\n\nLinhas cobertas: '+l.covered+'/'+l.total+' ('+l.pct+'%)')" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
          VITE_VAPID_KEY: ${{ vars.VITE_VAPID_KEY }}
          VITE_MEASUREMENT_ID: ${{ vars.VITE_MEASUREMENT_ID }}
          VITE_OWNER_APP_URL: ${{ vars.VITE_OWNER_APP_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - name: Test with coverage
        run: |
          set -o pipefail
          npm run test:coverage | tee coverage.txt
      - name: Coverage summary
        run: |
          {
            echo '### Cobertura functions'
            echo
            grep 'all files' coverage.txt | sed 's/^# *//' | awk -F'|' '{gsub(/ /,"",$2);gsub(/ /,"",$3);gsub(/ /,"",$4);printf "Linhas: %s%% | Branches: %s%% | Funções: %s%%\n",$2,$3,$4}'
          } >> "$GITHUB_STEP_SUMMARY"

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.filter.outputs.apk }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            apk:
              - 'app/pubspec.yaml'
              - 'app/pubspec.lock'
              - 'app/android/**'

  apk-debug:
    needs: changes
    if: needs.changes.outputs.apk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm install -g firebase-tools@15.33.0
      - run: npm test

  deploy-hosting:
    needs: [flutter, web, functions, rules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: npm install -g firebase-tools@15.33.0
      - name: Skip notice
        if: env.FIREBASE_TOKEN == ''
        run: echo "::warning::FIREBASE_TOKEN não configurado; hosting não foi publicado."
      - name: Deploy hosting
        if: env.FIREBASE_TOKEN != ''
        run: firebase deploy --only hosting --project qio-app
