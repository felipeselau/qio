name: tmp-goldens
on:
  push:
    branches: [test/wizard-goldens]
jobs:
  gen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          cache: true
      - run: flutter pub get
      - run: flutter test --update-goldens test/golden/create_queue_golden_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: new-goldens
          path: app/test/goldens/create_*.png
