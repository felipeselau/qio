<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Painel do dono do Qio: filas presenciais">
  <meta name="theme-color" content="#2563EB">
  <meta name="color-scheme" content="light dark">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Qio">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Qio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F9FAFB; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0B1220; }
    }
    #qio-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F9FAFB;
      z-index: 1;
    }
    #qio-loader .ring {
      width: 40px;
      height: 40px;
      box-sizing: border-box;
      border: 4px solid rgba(37, 99, 235, 0.2);
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: qio-spin 0.9s linear infinite;
    }
    @media (prefers-color-scheme: dark) {
      #qio-loader { background: #0B1220; }
      #qio-loader .ring {
        border-color: rgba(96, 165, 250, 0.2);
        border-top-color: #60A5FA;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #qio-loader .ring { animation-duration: 3s; }
    }
    @keyframes qio-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="qio-loader" role="status" aria-label="Carregando"><div class="ring"></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('qio-loader');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
